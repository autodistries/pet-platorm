version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pet-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: petadmin
      POSTGRES_PASSWORD: petpassword123
      POSTGRES_DB: pet_accessories_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petadmin -d pet_accessories_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
